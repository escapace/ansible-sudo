---
- name: validate wheel sudo policy
  ansible.builtin.assert:
    that: sudo_wheel_nopasswd is boolean
    fail_msg: sudo_wheel_nopasswd must be a boolean

- name: install sudo
  ansible.builtin.package:
    name: sudo
    state: present

- name: allow wheel to use sudo without a password
  ansible.builtin.copy:
    content: "%wheel ALL=(ALL) NOPASSWD: ALL\n"
    dest: /etc/sudoers.d/90-ansible-sudo
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
  when: sudo_wheel_nopasswd

- name: remove passwordless wheel sudo policy
  ansible.builtin.file:
    path: /etc/sudoers.d/90-ansible-sudo
    state: absent
  when: not sudo_wheel_nopasswd
